<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ce-bg" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#0E2A4A"/><stop offset="0.55" stop-color="#071226"/><stop offset="1" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="ce-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22F5D0"/><stop offset="0.5" stop-color="#22B8F5"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="ce-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#ce-bg)"/>
  <g transform="translate(256 256) scale(0.76) translate(-256 -256)">
  
  
  
  <g transform="translate(-14 4)">
  <g fill="none" stroke="url(#ce-neon)" stroke-linecap="round" stroke-linejoin="round" filter="url(#ce-glow)">
    <!-- ear tubes forming a U -->
    <path stroke-width="22" d="M128 92v96c0 72 44 120 100 120s100-48 100-120V92"/>
    <!-- tube down to chest piece -->
    <path stroke-width="22" d="M228 308v34c0 58 30 86 74 86s72-28 72-70v-6"/>
    <!-- chest piece ring -->
    <circle cx="374" cy="292" r="62" stroke-width="20" fill="#06101F"/>
  </g>
  <!-- ear tips -->
  <g fill="#E0FFFA" filter="url(#ce-glow)">
    <circle cx="128" cy="86" r="20"/><circle cx="328" cy="86" r="20"/>
  </g>
  <!-- heartbeat inside chest piece -->
  <path d="M326 294h18l12-26 18 52 16-40 8 14h20" fill="none" stroke="#E0FFFA" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#ce-glow)"/>
  <!-- AI nodes on tube -->
  <g fill="#E0FFFA"><circle cx="128" cy="188" r="9"/><circle cx="328" cy="188" r="9"/><circle cx="228" cy="308" r="11"/></g>
  </g>
</g>
</svg>
